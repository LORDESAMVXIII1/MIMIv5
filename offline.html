<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MIMI - Offline</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #fff5f8;
    color: #4a3b45;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { color: #ff6fa5; margin-bottom: 8px; }
  p { color: #b08a9c; margin: 4px 0 20px; }
  button {
    background: #ff6fa5;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>MIMI</h1>
  <p>Você está offline. Verifique sua conexão e tente novamente.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</body>
</html>
